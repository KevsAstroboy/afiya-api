#version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemedecine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: [ "postgres", "-c", "max_prepared_transactions=100" ]

  # Service API Nyuman
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - PYTHONPATH=/
    volumes:
      - .:/app/app
    working_dir: /app/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Redis (session store)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    # Service Minio (Object Storage)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # Daily data generator (manual trigger)
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    command: python init-scripts/daily_data_generator.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/
    volumes:
      - .:/app/app
    working_dir: /app/app
    depends_on:
      - postgres

volumes:
    postgres_data:
    redis_data:
    minio_data:
































